{% extends 'base.html' %}

{% block titulo %}Entrar Gestão Escolar{% endblock %}

{% block conteudo %}
<section class="caixa-login">
    <h2>Entrar</h2>

    {% if form.errors %}
    <p class="msg error" role="alert">Usuario ou senha incorretos.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="id_username">Usuario</label>
        <input type="text" name="username" id="id_username" required autofocus>

        <label for="id_password">Senha</label>
        <input type="password" name="password" id="id_password" required>

        <button type="submit" class="btn">Entrar</button>
    </form>

    <div class="rodape-login">
        <span>Não tem uma conta?</span>
        <a href="{% url 'cadastro' %}" class="link-cadastro">Cadastre-se</a>
    </div>
</section>
{% endblock %}
